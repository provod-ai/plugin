<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Provod</title><style>
:root{color-scheme:dark;--bg:var(--color-background-primary,#101014);--surface:var(--color-background-secondary,#18181e);--surface2:#202027;--fg:var(--color-text-primary,#f5f4f8);--muted:var(--color-text-secondary,#9b99a7);--line:var(--color-border-primary,#30303a);--violet:#9b8cff;--orange:#ffb26b;--radius:var(--border-radius-lg,16px)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:14px 16px 16px;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-sans,ui-sans-serif,system-ui,sans-serif)}button{font:inherit;color:inherit;cursor:var(--cursor-interaction,pointer)}button:disabled{opacity:.45;cursor:default}.app{width:min(100%,680px);margin:0 auto}.header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.orb{width:27px;height:27px;border-radius:50%;background:conic-gradient(from 190deg,var(--orange),var(--violet),#70b6ff,var(--orange));box-shadow:0 0 22px #9b8cff55}.brand{font-weight:720;letter-spacing:-.02em}.header-note{margin-left:auto;color:var(--muted);font-size:12px}.surface{border:1px solid var(--line);background:linear-gradient(145deg,var(--surface2),var(--surface));border-radius:var(--radius);overflow:hidden}.stage{min-height:290px;display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,#8f80ff55,transparent 31%),linear-gradient(140deg,#28233e,#111117 63%,#38281f);position:relative}.stage:after{content:'PROVOD';position:absolute;left:18px;bottom:14px;color:#fff7;font-size:10px;letter-spacing:.18em}.stage-copy{color:#fff9;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.media-wrap{padding:14px;background:#0d0d11}.media{display:block;width:100%;max-height:560px;border-radius:11px;object-fit:contain;background:#09090c}.result-info{padding:15px 18px 13px}.result-line{display:flex;align-items:center;gap:10px}.result-line strong{font-size:17px;letter-spacing:-.03em}.status{margin-left:auto;color:var(--muted);font-size:12px}.result-sub{margin-top:4px;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 16px}.btn{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#ffffff08}.primary{background:var(--violet);border-color:var(--violet);color:#17151e;font-weight:650}.ghost{background:#ffffff08}.footer{display:flex;gap:8px;padding:11px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.notice{min-height:18px;padding:8px 2px 0;color:var(--muted);font-size:12px}.notice.error{color:#ff9f9f}.library-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}.library-head h1{margin:0;font-size:21px;letter-spacing:-.04em}.back{border:0;background:transparent;color:var(--muted);padding:0}.filters{display:flex;gap:6px;padding:0 18px 14px;overflow:auto}.filter{border:1px solid var(--line);border-radius:999px;background:transparent;padding:6px 10px;color:var(--muted);white-space:nowrap}.filter.active{background:var(--violet);border-color:var(--violet);color:#17151e;font-weight:650}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 18px 18px}.gallery-card{min-width:0;border:1px solid var(--line);border-radius:11px;background:#101014;overflow:hidden;text-align:left;padding:0}.gallery-media{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#24212f}.gallery-label{display:block;padding:8px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty-library{padding:38px 18px;text-align:center;color:var(--muted)}.loading{padding:36px 18px;text-align:center;color:var(--muted)}@media(max-width:500px){body{padding:10px}.stage{min-height:230px}.media-wrap{padding:10px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));padding-left:12px;padding-right:12px}.library-head{padding-left:14px;padding-right:14px}.filters{padding-left:14px;padding-right:14px}.result-info{padding-left:14px;padding-right:14px}.actions{padding-left:14px;padding-right:14px}.footer{padding-left:14px;padding-right:14px}}
</style></head><body><main class="app"><header class="header"><div class="orb" aria-hidden="true"></div><strong class="brand">Provod</strong><span class="header-note">Creative workspace</span><button id="workspace" class="btn ghost" type="button">My creations ↗</button></header><section id="result-surface" class="surface" aria-live="polite"><div id="empty"><div class="stage"><span class="stage-copy">Your next creation</span></div><div class="result-info"><div class="result-line"><strong>Make something worth keeping.</strong><span class="status">Ready</span></div><div class="result-sub">Describe an image or video in the conversation. The result will appear here.</div></div><div class="footer"><span>Prompt and navigation stay with the host</span></div></div><div id="result" hidden><div id="result-media" class="media-wrap"></div><div class="result-info"><div class="result-line"><strong id="result-title">Your result</strong><span class="status">Ready to use</span></div><div id="result-sub" class="result-sub"></div></div><div class="actions"><button id="use-chat" class="btn primary" type="button">Use in chat</button><button id="open-library" class="btn ghost" type="button">My creations</button></div><div class="footer"><span>Generated with Provod</span><span>·</span><span>UI is optional</span></div></div></section><section id="library" class="surface" hidden><div class="library-head"><button id="back-result" class="back" type="button">← Back</button><h1>My creations</h1></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="image">Images</button><button class="filter" data-filter="video">Videos</button></div><div id="gallery" class="gallery"></div><button id="load-more" class="btn ghost" type="button" hidden>Load more</button></section><p id="notice" class="notice" role="status"></p></main><script>
const $=s=>document.querySelector(s),legacyBridge=window.openai||window.mcpApp||null;let resultUrl='',resultResourceUri='',resultId='',libraryItems=[],libraryFilter='all',libraryCursor=null;
function createPortableBridge(){if(window.parent===window)return null;let nextId=1,hostOrigin='*';const pending=new Map();const post=m=>window.parent.postMessage(m,hostOrigin);const request=(method,params)=>{const id=nextId++,response=new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));post({jsonrpc:'2.0',id,method,params});return response};const ready=(async()=>{const result=await request('ui/initialize',{protocolVersion:'2026-01-26',capabilities:{},clientInfo:{name:'provod-widget',version:'1.0.0'}});post({jsonrpc:'2.0',method:'notifications/initialized'});return result})();window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.jsonrpc!=='2.0')return;if(hostOrigin==='*'&&e.origin&&e.origin!=='null')hostOrigin=e.origin;else if(hostOrigin!=='*'&&e.origin!==hostOrigin)return;const m=e.data;if(m.id!==undefined&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result)}});return{ready,callTool:async(n,a)=>{await ready;return request('tools/call',{name:n,arguments:a})},message:async(p)=>{await ready;return request('ui/message',p)},displayMode:async(mode)=>{await ready;return request('ui/request-display-mode',{mode})}}}
const portableBridge=createPortableBridge();const unwrap=r=>r?.structuredContent??r?.data??r?.content??r;const note=(s,error=false)=>{$('#notice').textContent=s;$('#notice').className=error?'notice error':'notice'};async function call(name,args={}){if(portableBridge)return unwrap(await portableBridge.callTool(name,args));if(!legacyBridge?.callTool)throw Error('Open this MCP App inside a compatible host to use Provod tools.');return unwrap(await legacyBridge.callTool(name,args))}
function urlOf(value){return typeof value==='string'?value:value?.url??value?.downloadUrl??value?.download_url??value?.rawUrl??value?.raw_url??value?.results?.rawUrl??null}function resourceOf(value,parent={}){return value?.resourceUri??value?.resource_uri??parent?.resourceUri??parent?.resource_uri??null}function idOf(value,parent={}){return value?.id??parent?.id??null}function kindOf(value,parent={}){const t=String(value?.type??value?.kind??value?.mimeType??value?.mime_type??parent.type??'').toLowerCase();return t==='video'||t.startsWith('video/')||/\.(mp4|webm|mov)(?:$|\?)/i.test(urlOf(value)||'')?'video':'image'}
function mediaElement(value,parent={}){const url=urlOf(value);if(!url)return null;let parsed;try{parsed=new URL(url,location.href)}catch{return null}if(!['https:','http:'].includes(parsed.protocol))return null;const video=kindOf(value,parent)==='video',el=document.createElement(video?'video':'img');el.className='media';el.src=parsed.href;el.alt=video?'Generated Provod video':'Generated Provod image';if(video){el.controls=true;el.playsInline=true}return el}
function firstOutput(item){return item?.outputs?.[0]??(Array.isArray(item?.results)?item.results[0]:item?.results)??item}
function renderResult(output){const item=output?.generation??output?.item??output?.items?.[0]??output,value=firstOutput(item),el=mediaElement(value,item);if(!el){note('The generation completed, but no safe preview URL was returned.',true);return}resultUrl=el.src;resultResourceUri=resourceOf(value,item)||'';resultId=idOf(value,item)||'';$('#result-media').replaceChildren(el);$('#result-sub').textContent=`${item?.type??kindOf(value,item)} · ${item?.model??'Provod'}`;$('#empty').hidden=true;$('#result').hidden=false;$('#library').hidden=true}
function renderGallery(){const grid=$('#gallery');grid.replaceChildren();const items=libraryItems.filter(i=>libraryFilter==='all'||String(i.type).toLowerCase()===libraryFilter);if(!items.length){grid.innerHTML='<div class="empty-library">No creations in this view yet.</div>';return}for(const item of items){const value=firstOutput(item),el=mediaElement(value,item);if(!el)continue;const card=document.createElement('button');card.className='gallery-card';card.type='button';const thumb=el.cloneNode(true);thumb.className='gallery-media';if(thumb.tagName==='VIDEO'){thumb.muted=true;thumb.controls=false}card.append(thumb);const label=document.createElement('span');label.className='gallery-label';label.textContent=`${item.type??kindOf(value,item)} · ${item.model??'Provod'}`;card.append(label);card.onclick=()=>renderResult(item);grid.append(card)}if(!grid.children.length)grid.innerHTML='<div class="empty-library">No previewable creations found.</div>'}
async function showLibrary(reset=true){if(reset){libraryItems=[];libraryCursor=null}if(portableBridge?.displayMode){try{await portableBridge.displayMode('fullscreen')}catch{note('Fullscreen is unavailable; showing your creations here instead.')}}$('#result-surface').hidden=true;$('#library').hidden=false;if(reset)$('#gallery').innerHTML='<div class="loading">Loading your creations…</div>';try{const args={size:24,...(libraryFilter!=='all'?{type:libraryFilter}:{}),...(libraryCursor?{cursor:libraryCursor}:{})};const data=await call('show_generations',args);libraryItems=reset?(data?.items??[]):[...libraryItems,...(data?.items??[])];libraryCursor=data?.next_cursor??null;renderGallery();$('#load-more').hidden=!libraryCursor}catch(e){$('#gallery').innerHTML='<div class="empty-library">Could not load creations.</div>';note(e.message,true)}}
function showResult(){if(resultUrl){$('#library').hidden=true;$('#result-surface').hidden=false}else{$('#library').hidden=true;$('#result-surface').hidden=false}}
async function workspace(){await showLibrary()}$('#workspace').onclick=workspace;$('#open-library').onclick=workspace;$('#load-more').onclick=()=>showLibrary(false);$('#back-result').onclick=showResult;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{libraryFilter=b.dataset.filter;libraryCursor=null;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));showLibrary()});$('#use-chat').onclick=()=>{if(!resultResourceUri&&!resultId)return;const text=resultId?`Use this Provod generation in the current conversation: ${resultId}`:'Use this Provod generation in the current conversation.';const content=resultResourceUri?[{type:'resource_link',uri:resultResourceUri,name:'Provod generated result'},{type:'text',text}]:[{type:'text',text}];if(portableBridge)portableBridge.message({role:'user',content}).catch(e=>note(e.message,true));else if(legacyBridge?.sendFollowUpMessage)legacyBridge.sendFollowUpMessage({prompt:text}).catch(e=>note(e.message,true))};function toolPayload(params){return params?.structuredContent??params?.result??params?.content??params?.data??params}window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.method==='ui/notifications/tool-result')renderResult(toolPayload(e.data.params))},{passive:true});
</script></body></html>
