<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Provod Studio</title><style>
:root{color-scheme:dark;--bg:var(--color-background-primary,#111117);--surface:var(--color-background-secondary,#1b1b24);--surface2:#20202a;--fg:var(--color-text-primary,#f6f5fb);--muted:var(--color-text-secondary,#a3a1b0);--line:var(--color-border-primary,#30303c);--violet:#9b8cff;--orange:#ffb26b;--radius:var(--border-radius-lg,16px)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:15px;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-sans,ui-sans-serif,system-ui,sans-serif)}button,select{font:inherit;color:inherit}button{cursor:var(--cursor-interaction,pointer)}button:disabled{opacity:.45;cursor:default}.app{width:min(100%,650px);margin:0 auto}.header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.orb{width:28px;height:28px;border-radius:50%;background:conic-gradient(from 190deg,var(--orange),var(--violet),#70b6ff,var(--orange));box-shadow:0 0 24px #9b8cff66}.brand{font-weight:720;letter-spacing:-.02em}.status{margin-left:auto;color:var(--muted);font-size:12px}.surface{border:1px solid var(--line);background:linear-gradient(145deg,var(--surface2),var(--surface));border-radius:var(--radius);overflow:hidden}.stage{min-height:250px;display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,#8f80ff55,transparent 31%),linear-gradient(140deg,#28233e,#111117 63%,#38281f);position:relative}.stage:after{content:'PROVOD';position:absolute;bottom:14px;left:18px;color:#fff7;font-size:10px;letter-spacing:.18em}.stage-copy{font-size:13px;color:#fff9;letter-spacing:.16em;text-transform:uppercase}.result{display:grid;gap:12px;padding:16px 18px}.result-meta{display:flex;align-items:center;gap:10px}.result-meta strong{font-size:18px;letter-spacing:-.03em}.result-meta .status{margin-left:auto}.result-media{display:block;width:100%;max-height:390px;border-radius:11px;object-fit:cover}.body{padding:16px 18px}.row{display:flex;gap:10px;align-items:center}.title{font-size:18px;font-weight:680;letter-spacing:-.03em}.tag{margin-left:auto;color:#cfcaff;background:#554aa833;border:1px solid #776de655;border-radius:999px;padding:4px 8px;font-size:11px}.sub{color:var(--muted);margin-top:5px}.tools{display:flex;gap:8px;margin-top:16px}.control{background:#111117;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;flex:1;min-width:0}.btn{border:0;border-radius:9px;padding:8px 13px;font:inherit;white-space:nowrap}.primary{background:var(--violet);color:#17151e;font-weight:650}.ghost{background:#ffffff0a;color:var(--fg);border:1px solid var(--line)}.footer{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer .btn{margin-left:auto}.notice{min-height:18px;padding:8px 2px 0;color:var(--muted);font-size:12px}.notice.error{color:#ff9f9f}@media(max-width:430px){body{padding:10px}.stage{min-height:190px}.tools{flex-wrap:wrap}.control{min-width:42%}.tools .primary{flex:1}.result,.body{padding:14px}.footer{padding:11px 14px;align-items:flex-start}.footer .btn{margin-left:auto}}
</style></head><body><main class="app"><header class="header"><div class="orb" aria-hidden="true"></div><strong class="brand">Provod Studio</strong><span id="balance" class="status"></span><button id="workspace" class="btn ghost" type="button">Open workspace ↗</button></header><section class="surface" aria-labelledby="title"><div id="empty"><div class="stage"><span class="stage-copy">Generated preview</span></div><div class="body"><div class="row"><div class="title" id="title">Create something worth keeping.</div><span class="tag">INLINE</span></div><div class="sub">Ask the conversation to make an image or video. The finished result will appear here.</div><div class="tools"><select id="model" class="control"><option>Discovering models…</option></select><select id="ratio" class="control"><option>1:1</option><option>16:9</option><option>9:16</option></select><button id="image" class="btn primary" type="button">Create image</button><button id="video" class="btn ghost" type="button">Create video</button></div></div></div><div id="result" class="result" hidden><div class="result-meta"><strong>Your result</strong><span class="status">Ready to use</span></div><div id="result-media"></div><div class="tools"><button id="use-chat" class="btn primary" type="button">Use in chat</button><button id="new-result" class="btn ghost" type="button">Create another</button></div></div><footer class="footer"><span>Prompt comes from the conversation</span><span>·</span><span>UI is optional</span></footer></section><p id="notice" class="notice" role="status"></p></main><script>
const $=s=>document.querySelector(s),legacyBridge=window.openai||window.mcpApp||null;let resultUrl='';
function createPortableBridge(){if(window.parent===window)return null;let nextId=1,hostOrigin='*';const pending=new Map();const post=(message)=>window.parent.postMessage(message,hostOrigin);const request=(method,params)=>{const id=nextId++;const response=new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));post({jsonrpc:'2.0',id,method,params});return response};const ready=(async()=>{const result=await request('ui/initialize',{protocolVersion:'2026-01-26',capabilities:{},clientInfo:{name:'provod-widget',version:'1.0.0'}});post({jsonrpc:'2.0',method:'notifications/initialized'});return result})();window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;if(hostOrigin==='*'&&event.origin&&event.origin!=='null')hostOrigin=event.origin;else if(hostOrigin!=='*'&&event.origin!==hostOrigin)return;const message=event.data;if(message.id!==undefined&&pending.has(message.id)){const item=pending.get(message.id);pending.delete(message.id);message.error?item.reject(message.error):item.resolve(message.result)}});return{ready,callTool:async(name,args)=>{await ready;return request('tools/call',{name,arguments:args})},message:async(params)=>{await ready;return request('ui/message',params)},displayMode:async(mode)=>{await ready;return request('ui/request-display-mode',{mode})}}}
const portableBridge=createPortableBridge();
const unwrap=r=>r?.structuredContent??r?.data??r?.content??r;
const note=(s,error=false)=>{$('#notice').textContent=s;$('#notice').className=error?'notice error':'notice'};
async function call(name,args={}){if(portableBridge)return unwrap(await portableBridge.callTool(name,args));if(!legacyBridge?.callTool)throw Error('Open this MCP App inside a compatible host to use Provod tools.');return unwrap(await legacyBridge.callTool(name,args))}
async function send(kind){const model=$('#model').value,ratio=$('#ratio').value,prompt=`Create a ${kind} with Provod using ${model||'the best available model'} and aspect ratio ${ratio}.`;try{if(portableBridge)await portableBridge.message({role:'user',content:[{type:'text',text:prompt}]});else if(legacyBridge?.sendFollowUpMessage)await legacyBridge.sendFollowUpMessage({prompt});else if(legacyBridge?.request)await legacyBridge.request('ui/message',{role:'user',content:[{type:'text',text:prompt}]});else throw Error('Open this widget in a compatible host to send a request.');note('Request sent to the conversation.')}catch(e){note(e.message,true)}}
async function workspace(){try{if(portableBridge?.displayMode)await portableBridge.displayMode('fullscreen');else if(legacyBridge?.requestModal)await legacyBridge.requestModal({title:'Provod workspace'});else if(portableBridge)await portableBridge.message({role:'user',content:[{type:'text',text:'Show my recent Provod generations.'}]});else if(legacyBridge?.sendFollowUpMessage)await legacyBridge.sendFollowUpMessage({prompt:'Show my recent Provod generations.'});else throw Error('The host does not expose a workspace presentation.')}catch(e){note(e.message,true)}}
function render(output){const value=output?.media?.[0]??output?.outputs?.[0]??(Array.isArray(output?.results)?output.results[0]:output?.results)??output;const url=typeof value==='string'?value:value?.url??value?.downloadUrl??value?.download_url??value?.rawUrl??value?.raw_url;if(!url)return;let parsed;try{parsed=new URL(url,location.href)}catch{return}if(!['https:','http:'].includes(parsed.protocol)){note('The result URL was rejected for safety.',true);return}resultUrl=parsed.href;const mediaType=String(value?.type??value?.kind??value?.mimeType??value?.mime_type??output?.type??'').toLowerCase();const isVideo=mediaType==='video'||mediaType.startsWith('video/')||/\.(mp4|webm|mov)(?:$|\?)/i.test(parsed.pathname);const mediaElement=document.createElement(isVideo?'video':'img');mediaElement.className='result-media';mediaElement.src=parsed.href;mediaElement.alt='Generated Provod result';if(isVideo){mediaElement.controls=true;mediaElement.playsInline=true}const media=$('#result-media');media.replaceChildren(mediaElement);$('#empty').hidden=true;$('#result').hidden=false}
$('#image').onclick=()=>send('image');$('#video').onclick=()=>send('video');$('#workspace').onclick=workspace;$('#new-result').onclick=()=>{$('#result').hidden=true;$('#empty').hidden=false};$('#use-chat').onclick=()=>{if(!resultUrl)return;const prompt=`Use this Provod result in the current conversation: ${resultUrl}`;if(portableBridge)portableBridge.message({role:'user',content:[{type:'text',text:prompt}]}).catch(e=>note(e.message,true));else if(legacyBridge?.sendFollowUpMessage)legacyBridge.sendFollowUpMessage({prompt}).catch(e=>note(e.message,true))};
window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.method==='ui/notifications/tool-result')render(e.data.params?.structuredContent)},{passive:true});
(async()=>{try{const r=await call('models_explore'),models=Array.isArray(r)?r:r?.models??r?.items??[];$('#model').innerHTML=models.map(m=>`<option>${String(m.name??m.id??m.model_id).replaceAll('<','&lt;')}</option>`).join('')||'<option>No live models</option>'}catch(e){note(e.message,true)}try{const r=await call('balance'),credits=r?.credits??r?.balance;if(credits!==undefined)$('#balance').textContent=`${credits} credits`}catch{}})();
</script></body></html>
