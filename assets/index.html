<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provod</title>
<style>
:root{color-scheme:light dark;--bg:var(--color-background-primary,Canvas);--fg:var(--color-text-primary,CanvasText);--muted:var(--color-text-secondary,#73777d);--border:var(--color-border-primary,#c8ccd1);--panel:var(--color-background-secondary,color-mix(in srgb,var(--fg) 5%,var(--bg)));--accent:var(--color-text-info,#1683d8);--radius:var(--border-radius-lg,12px)}*{box-sizing:border-box}body{margin:0;padding:16px;color:var(--fg);background:var(--bg);font:14px/1.45 var(--font-sans,-apple-system,system-ui,sans-serif)}button,input,select,textarea{font:inherit;color:inherit}button,select,input,textarea{border:1px solid var(--border);border-radius:8px;background:var(--bg)}button{min-height:28px;padding:0 9px;cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.app{max-width:860px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.brand{font-weight:600;flex:1}.status{color:var(--muted);font-size:12px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}.tab{border:0;border-radius:7px 7px 0 0;color:var(--muted);background:transparent}.tab.active{color:var(--fg);background:var(--panel);font-weight:600}.view[hidden]{display:none}.composer{display:grid;gap:10px}.prompt{width:100%;min-height:88px;padding:10px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar>*{min-height:28px}.select{padding:0 8px}.field{display:grid;gap:5px;min-width:140px}.field label{font-size:12px;color:var(--muted)}.primary{color:var(--color-background-primary,#fff);background:var(--color-text-primary,#1a1a1a);border-color:var(--color-text-primary,#1a1a1a)}.card{padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.asset{padding:0;overflow:hidden;text-align:left}.asset img,.asset video{display:block;width:100%;aspect-ratio:1;object-fit:cover}.asset .asset-meta{display:grid;gap:4px;padding:8px}.asset.selected{outline:2px solid var(--accent);outline-offset:2px}.model{min-height:96px;text-align:left}.model strong{display:block;margin-bottom:4px}.muted{color:var(--muted)}.result{min-height:180px;display:grid;place-items:center;text-align:center}.result img,.result video{max-width:100%;max-height:480px;border-radius:8px}.progress{display:grid;gap:8px;text-align:left;width:min(100%,360px)}.track{height:5px;border-radius:9px;background:color-mix(in srgb,var(--fg) 12%,transparent);overflow:hidden}.bar{height:100%;width:35%;background:var(--accent);animation:pulse 1.2s infinite alternate}@keyframes pulse{to{width:75%}}.list{display:grid;gap:8px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.drop{padding:12px;border:1px dashed var(--border);border-radius:8px;text-align:center;color:var(--muted)}.error{color:var(--destructive,#c43d26)}@media(max-width:520px){body{padding:10px}.top{align-items:flex-start}.toolbar .field{flex:1 1 45%}.tabs{overflow:auto}.tab{white-space:nowrap}.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="app"><header class="top"><div class="brand">Provod</div><span id="balance" class="status">Loading account…</span><button id="billing">Get credits</button></header>
<nav class="tabs" aria-label="Views"><button class="tab active" data-view="create">Create</button><button class="tab" data-view="models">Models</button><button class="tab" data-view="library">Library</button><button class="tab" data-view="account">Account</button></nav>
<section id="create" class="view"><div class="composer"><textarea id="prompt" class="prompt" placeholder="Describe what you want to make…"></textarea><div class="toolbar"><div class="field"><label for="mode">Type</label><select id="mode" class="select"><option value="image">Image</option><option value="video">Video</option></select></div><div class="field"><label for="model">Model</label><select id="model" class="select"><option value="">Discovering models…</option></select></div><div class="field"><label for="ratio">Aspect</label><select id="ratio" class="select"><option>1:1</option><option>16:9</option><option>9:16</option></select></div><button id="generate" class="primary">Generate</button></div><div class="drop"><label for="file">Reference media</label><input id="file" type="file" accept="image/*,video/*"></div><div id="chips" class="muted"></div><div id="result" class="card result"><div><strong>Waiting for a generation</strong><div class="muted">Results appear here after a live MCP response.</div></div></div></div></section>
<section id="models" class="view" hidden><div class="top"><div><strong>Models</strong><div class="muted">Returned by Provod MCP</div></div><button id="refreshModels">Refresh</button></div><div id="modelGrid" class="grid"><div class="card muted">Loading models…</div></div></section>
<section id="library" class="view" hidden><div class="top"><div><strong>Library</strong><div class="muted">Your live generation assets</div></div><button id="refreshHistory">Refresh</button></div><div id="historyList" class="gallery"><div class="card muted">Loading library…</div></div></section>
<section id="account" class="view" hidden><div class="top"><div><strong>Account</strong><div class="muted">Read-only account data</div></div><button id="refreshAccount">Refresh</button></div><div id="accountList" class="card list"><div class="muted">Loading account…</div></div></section>
<p id="notice" class="status" role="status"></p></main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const T={models:'models_explore',upload:'media_upload',importUrl:'media_import_url',generateImage:'generate_image',generateVideo:'generate_video',jobsWait:'jobs_wait',generations:'show_generations',balance:'balance',transactions:'transactions',workspaces:'list_workspaces',billing:'confirm_billing_purchase'};
const state={models:[],media:[],view:'create'};const host=window.openai||window.mcpApp||null;
const unwrap=r=>r?.structuredContent??r?.data??r?.content??r;const id=m=>m?.id??m?.model_id??m?.name??'';const text=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(s,error=false){$('#notice').textContent=s;$('#notice').className=error?'error':''}async function call(t,a={}){if(!host?.callTool)throw Error('Open this MCP App inside a compatible host to use '+t);return unwrap(await host.callTool(t,a))}
function show(v){state.view=v;$$('.view').forEach(x=>x.hidden=x.id!==v);$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(v==='models')loadModels();if(v==='library')loadHistory();if(v==='account')loadAccount()}
$$('.tab').forEach(x=>x.onclick=()=>show(x.dataset.view));
function modelOptions(){const s=$('#model');s.innerHTML=state.models.map(m=>`<option value="${text(id(m))}">${text(m.name||id(m))}</option>`).join('')||'<option value="">No live models</option>'}
async function loadModels(){try{const d=await call(T.models);state.models=Array.isArray(d)?d:(d?.models||d?.items||[]);modelOptions();$('#modelGrid').innerHTML=state.models.map(m=>`<article class="card model"><strong>${text(m.name||id(m))}</strong><span class="muted">${text(m.description||m.type||'Model returned by Provod MCP')}</span></article>`).join('')||'<div class="card muted">No models returned.</div>'}catch(e){$('#modelGrid').innerHTML=`<div class="card error">${text(e.message)}</div>`;note(e.message,true);modelOptions()}}
async function loadHistory(){try{const d=await call(T.generations,{limit:24}),rows=Array.isArray(d)?d:(d?.generations||d?.items||[]);$('#historyList').innerHTML=rows.map((x,i)=>{const media=x.media||x.outputs||x.results||[],first=Array.isArray(media)?media[0]:media,url=x.url||first?.url||first?.download_url;return `<article class="asset card" data-asset='${text(JSON.stringify({id:x.id,url,title:x.title||x.prompt||x.id}))}'>${url?`<img src="${text(url)}" alt="${text(x.title||'Generated asset')}">`:'<div class="result"><span class="muted">No preview</span></div>'}<div class="asset-meta"><strong>${text(x.title||x.prompt||x.id||'Generation')}</strong><span class="muted">${text(x.status||x.created_at||'')}</span><button class="use-chat" type="button">Use in chat</button></div></article>`}).join('')||'<div class="card muted">No assets returned.</div>';$$('.asset').forEach(el=>{el.onclick=()=>$$('.asset').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');el.querySelector('.use-chat')?.addEventListener('click',e=>{e.stopPropagation();useInChat(JSON.parse(el.dataset.asset))})})}catch(e){$('#historyList').innerHTML=`<div class="card error">${text(e.message)}</div>`}}
async function useInChat(asset){const message=`Use this Provod asset in the current conversation: ${asset.id||asset.url||asset.title}`;if(typeof host?.sendFollowUpMessage==='function'){await host.sendFollowUpMessage({prompt:message});note('Asset sent to the active chat.')}else if(typeof host?.request==='function'){await host.request('ui/message',{role:'user',content:[{type:'text',text:message}],_meta:{'openai/message':{target:'active',send:true}}});note('Asset sent to the active chat.')}else note('The MCP host does not expose chat attachment controls in this preview.',true)}
async function loadAccount(){try{const [b,t,w]=await Promise.all([call(T.balance),call(T.transactions,{limit:10}),call(T.workspaces)]),tx=t?.transactions||t||[],ws=w?.workspaces||w||[],credits=b?.credits??b?.balance??'—';$('#balance').textContent=`${credits} credits`,$('#accountList').innerHTML=`<div class="row"><span>Balance</span><strong>${text(credits)} credits</strong></div><div class="row"><span>Transactions</span><strong>${Array.isArray(tx)?tx.length:'—'}</strong></div><div class="row"><span>Workspaces</span><strong>${Array.isArray(ws)?ws.length:'—'}</strong></div>`}catch(e){$('#accountList').innerHTML=`<div class="error">${text(e.message)}</div>`;$('#balance').textContent='Account unavailable'}}
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const r=await call(T.upload,{filename:f.name,mime_type:f.type,size:f.size});const mid=r?.media_id||r?.id;if(mid)state.media.push(mid);$('#chips').textContent=mid?`Media ready: ${mid}`:'Media upload returned no id'}catch(err){note(err.message,true)}};
$('#generate').onclick=async()=>{const prompt=$('#prompt').value.trim(),model=$('#model').value;if(!prompt)return note('Add a description first',true);if(!model)return note('Select a live model first',true);const result=$('#result');$('#generate').disabled=true;result.innerHTML='<div class="progress"><strong>Waiting for Provod MCP…</strong><div class="track"><div class="bar"></div></div><span class="muted">Live job status; no fabricated percentage.</span></div>';try{const tool=$('#mode').value==='video'?T.generateVideo:T.generateImage,r=await call(tool,{prompt,model,aspect_ratio:$('#ratio').value,media_ids:state.media});const job=r?.job_id||r?.id||r?.generation_id;if(!job)throw Error('Generation response did not include a job id');const done=await call(T.jobsWait,{job_id:job}),out=done?.media||done?.results||done?.outputs||[],items=Array.isArray(out)?out:[out],cards=items.map((x,i)=>{const url=x?.url||x?.download_url||x;return url?`<article class="asset card"><${$('#mode').value==='video'?'video controls':'img'} src="${text(url)}" alt="Live generation result ${i+1}"></${$('#mode').value==='video'?'video':'img'}><div class="asset-meta"><span>Output ${i+1}</span><button class="use-chat" type="button" data-asset="${text(url)}">Use in chat</button></div></article>`:''}).join('');result.innerHTML=cards?`<div class="gallery">${cards}</div>`:`<div><strong>Generation completed</strong><div class="muted">Job ${text(job)} returned no preview URL.</div></div>`;$$('.use-chat').forEach(b=>b.onclick=()=>useInChat({url:b.dataset.asset}));}catch(e){result.innerHTML=`<div class="error">${text(e.message)}</div>`}finally{$('#generate').disabled=false}};
$('#billing').onclick=()=>{if(confirm('Open Provod billing? A purchase still requires explicit confirmation.'))note('Billing confirmation must be completed by the host.')};$('#refreshModels').onclick=loadModels;$('#refreshHistory').onclick=loadHistory;$('#refreshAccount').onclick=loadAccount;loadModels();loadAccount();
</script></body></html>
