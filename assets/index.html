<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Provod</title>
<style>
:root{color-scheme:light dark;--bg:var(--color-background-primary,Canvas);--surface:var(--color-background-secondary,color-mix(in srgb,CanvasText 5%,Canvas));--fg:var(--color-text-primary,CanvasText);--muted:var(--color-text-secondary,#73777d);--border:var(--color-border-primary,#c8ccd1);--radius:var(--border-radius-lg,12px)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:14px 16px 16px;color:var(--fg);background:var(--bg);font:14px/1.45 var(--font-sans,system-ui,sans-serif)}button,select{font:inherit;color:inherit}button,select{min-height:30px;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:0 9px}button{cursor:var(--cursor-interaction,pointer)}button:hover:not(:disabled),select:hover{border-color:var(--color-text-info,#1683d8)}button:disabled{opacity:.45;cursor:default}.app{width:min(100%,680px);margin:0 auto}.header{display:flex;align-items:center;gap:10px;margin-bottom:14px}.brand{flex:1;font-size:16px;font-weight:650}.status{color:var(--muted);font-size:12px}.surface{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}.empty,.result{padding:18px}.empty{display:grid;gap:5px;min-height:144px;align-content:center}.eyebrow{color:var(--muted);font-size:12px}h1,p{margin:0}h1{font-size:19px;line-height:1.2;letter-spacing:-.01em}.copy{max-width:48ch;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.primary{color:var(--color-background-primary,#fff);background:var(--color-text-primary,#1a1a1a);border-color:var(--color-text-primary,#1a1a1a)}.secondary{background:color-mix(in srgb,CanvasText 5%,Canvas)}.result{display:grid;gap:12px}.result-media{display:block;width:100%;max-height:390px;border-radius:9px;object-fit:cover}.result-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.result-meta strong{flex:1;min-width:150px}.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}.field{display:grid;gap:4px;min-width:150px;flex:1}.field label{color:var(--muted);font-size:12px}.field select{width:100%}.notice{min-height:18px;padding:8px 2px 0;color:var(--muted);font-size:12px}.notice.error{color:var(--color-text-danger,#c33)}@media(max-width:420px){body{padding:10px}.empty,.result{padding:14px}.toolbar{align-items:stretch}.toolbar button{flex:1}}
</style>
</head>
<body><main class="app">
<header class="header"><div class="brand">Provod</div><span id="balance" class="status"></span><button id="workspace" class="secondary" type="button">Open workspace</button></header>
<section class="surface" aria-labelledby="title"><div id="empty" class="empty"><span class="eyebrow">Creative tools</span><h1 id="title">Create from the conversation</h1><p class="copy">Ask the chat to make an image or video with Provod. Your result will appear here when the model finishes.</p><div class="actions"><button id="image" class="primary" type="button">Create an image</button><button id="video" class="secondary" type="button">Create a video</button></div></div><div id="result" class="result" hidden><div class="result-meta"><strong>Your Provod result</strong><span class="status">Completed</span></div><div id="result-media"></div><div class="actions"><button id="use-chat" class="primary" type="button">Use in chat</button><button id="new-result" class="secondary" type="button">Create another</button></div></div><div class="toolbar"><div class="field"><label for="model">Model</label><select id="model"><option>Discovering models…</option></select></div><div class="field"><label for="ratio">Aspect</label><select id="ratio"><option>1:1</option><option>16:9</option><option>9:16</option></select></div></div></section><p id="notice" class="notice" role="status"></p>
</main><script>
const $=s=>document.querySelector(s),legacyBridge=window.openai||window.mcpApp||null;let resultUrl='';
function createPortableBridge(){if(window.parent===window)return null;let nextId=1,hostOrigin='*';const pending=new Map();const post=(message)=>window.parent.postMessage(message,hostOrigin);const request=(method,params)=>{const id=nextId++;const response=new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));post({jsonrpc:'2.0',id,method,params});return response};const ready=(async()=>{const result=await request('ui/initialize',{protocolVersion:'2026-01-26',capabilities:{},clientInfo:{name:'provod-widget',version:'1.0.0'}});post({jsonrpc:'2.0',method:'notifications/initialized'});return result})();window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;if(hostOrigin==='*'&&event.origin&&event.origin!=='null')hostOrigin=event.origin;else if(hostOrigin!=='*'&&event.origin!==hostOrigin)return;const message=event.data;if(message.id!==undefined&&pending.has(message.id)){const item=pending.get(message.id);pending.delete(message.id);message.error?item.reject(message.error):item.resolve(message.result)}});return{ready,callTool:async(name,args)=>{await ready;return request('tools/call',{name,arguments:args})},message:async(params)=>{await ready;return request('ui/message',params)},displayMode:async(mode)=>{await ready;return request('ui/request-display-mode',{mode})}}}
const portableBridge=createPortableBridge();
const unwrap=r=>r?.structuredContent??r?.data??r?.content??r;
const note=(s,error=false)=>{$('#notice').textContent=s;$('#notice').className=error?'notice error':'notice'};
async function call(name,args={}){if(portableBridge)return unwrap(await portableBridge.callTool(name,args));if(!legacyBridge?.callTool)throw Error('Open this MCP App inside a compatible host to use Provod tools.');return unwrap(await legacyBridge.callTool(name,args))}
async function send(kind){const model=$('#model').value,ratio=$('#ratio').value,prompt=`Create a ${kind} with Provod using ${model||'the best available model'} and aspect ratio ${ratio}.`;try{if(portableBridge)await portableBridge.message({role:'user',content:[{type:'text',text:prompt}]});else if(legacyBridge?.sendFollowUpMessage)await legacyBridge.sendFollowUpMessage({prompt});else if(legacyBridge?.request)await legacyBridge.request('ui/message',{role:'user',content:[{type:'text',text:prompt}]});else throw Error('Open this widget in a compatible host to send a request.');note('Request sent to the conversation.')}catch(e){note(e.message,true)}}
async function workspace(){try{if(portableBridge?.displayMode)await portableBridge.displayMode('fullscreen');else if(legacyBridge?.requestModal)await legacyBridge.requestModal({title:'Provod workspace'});else if(portableBridge)await portableBridge.message({role:'user',content:[{type:'text',text:'Show my recent Provod generations.'}]});else if(legacyBridge?.sendFollowUpMessage)await legacyBridge.sendFollowUpMessage({prompt:'Show my recent Provod generations.'});else throw Error('The host does not expose a workspace presentation.')}catch(e){note(e.message,true)}}
function render(output){const value=output?.media?.[0]??output?.outputs?.[0]??output?.results?.[0]??output?.url,url=typeof value==='string'?value:value?.url??value?.download_url;if(!url)return;let parsed;try{parsed=new URL(url,location.href)}catch{return}if(!['https:','http:'].includes(parsed.protocol)){note('The result URL was rejected for safety.',true);return}resultUrl=parsed.href;const isVideo=String(value?.type??value?.mime_type??'').startsWith('video/')||/\.(mp4|webm|mov)(?:$|\?)/i.test(parsed.pathname);const mediaElement=document.createElement(isVideo?'video':'img');mediaElement.className='result-media';mediaElement.src=parsed.href;mediaElement.alt='Generated Provod result';if(isVideo){mediaElement.controls=true;mediaElement.playsInline=true}const media=$('#result-media');media.replaceChildren(mediaElement);$('#empty').hidden=true;$('#result').hidden=false}
$('#image').onclick=()=>send('image');$('#video').onclick=()=>send('video');$('#workspace').onclick=workspace;$('#new-result').onclick=()=>{$('#result').hidden=true;$('#empty').hidden=false};$('#use-chat').onclick=()=>{if(!resultUrl)return;const prompt=`Use this Provod result in the current conversation: ${resultUrl}`;if(portableBridge)portableBridge.message({role:'user',content:[{type:'text',text:prompt}]}).catch(e=>note(e.message,true));else if(legacyBridge?.sendFollowUpMessage)legacyBridge.sendFollowUpMessage({prompt}).catch(e=>note(e.message,true))};
window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.method==='ui/notifications/tool-result')render(e.data.params?.structuredContent)},{passive:true});
(async()=>{try{const r=await call('models_explore'),models=Array.isArray(r)?r:r?.models??r?.items??[];$('#model').innerHTML=models.map(m=>`<option>${String(m.name??m.id??m.model_id).replaceAll('<','&lt;')}</option>`).join('')||'<option>No live models</option>'}catch(e){note(e.message,true)}try{const r=await call('balance'),credits=r?.credits??r?.balance;if(credits!==undefined)$('#balance').textContent=`${credits} credits`}catch{}})();
</script></body></html>
