name: Validate plugin

on:
  workflow_dispatch:

# Automatic GitHub-hosted runners are intentionally disabled. Run this workflow
# manually only after a self-hosted runner is available; local validation remains
# the required gate until then.
permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate manifests, MCP configuration, and public files
        run: python scripts/validate_plugin.py .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check packaged paths for private material
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/provod-plugin.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          if tar -tzf "$archive" | grep -E '(^|/)(\.env|secrets?/|private/|credentials?/)' ; then
            echo 'forbidden private path found in package' >&2
            exit 1
          fi
